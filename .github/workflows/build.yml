name: Build installers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # Native runner per architecture — no cross-compiling, so the bundled
  # ffmpeg binary always matches the app's architecture.
  build-mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-13      # Intel
            arch: x64
            label: intel
          - runner: macos-14      # Apple Silicon
            arch: arm64
            label: apple-silicon
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Show bundled ffmpeg architecture
        run: |
          node -e "console.log('ffmpeg path:', require('ffmpeg-static'))"
          file "$(node -e "process.stdout.write(require('ffmpeg-static'))")" || true
      - name: Build app
        run: npx electron-builder --mac --${{ matrix.arch }} --publish never
      - name: List build output
        if: always()
        run: ls -la dist/ || true
      - name: Upload build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Telestrator-mac-${{ matrix.label }}
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: warn

  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build installer
        run: npx electron-builder --win --publish never
      - name: Upload installer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Telestrator-win
          path: dist/*.exe
          if-no-files-found: warn
