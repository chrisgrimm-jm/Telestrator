name: Build installers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # One build that runs on both Intel and Apple Silicon Macs. Safe to
  # cross-build because nothing architecture-specific is bundled anymore
  # (capture uses Electron's own camera engine, not an ffmpeg binary).
  build-mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - flag: universal
            label: universal
          - flag: arm64
            label: apple-silicon
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build app
        run: npx electron-builder --mac --${{ matrix.flag }} --publish never
      - name: List build output
        if: always()
        run: ls -la dist/ || true
      - name: Upload build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Telestrator-mac-${{ matrix.label }}
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: warn

  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build installer
        run: npx electron-builder --win --publish never
      - name: Upload installer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Telestrator-win
          path: dist/*.exe
          if-no-files-found: warn
