name: Release

# Push a tag like v1.0.0 to publish installers on the repo's Releases page,
# where they can be downloaded directly without digging through Actions.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build installer
        run: npx electron-builder --win --publish never
      - name: List output
        if: always()
        shell: bash
        run: ls -la dist/ || true
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          fail_on_unmatched_files: false
          generate_release_notes: true
      # Also keep it as a plain artifact in case the release step is skipped
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Telestrator-win
          path: dist/*.exe
          if-no-files-found: warn

  release-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build app
        run: npx electron-builder --mac --publish never
      - name: List output
        if: always()
        run: ls -la dist/ || true
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.zip
          fail_on_unmatched_files: false
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Telestrator-mac
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: warn
