<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Telestrator Capture</title>
</head>
<body>
  <!-- Hidden window: captures the selected camera via getUserMedia and
       streams JPEG frames to the server over WebSocket -->
  <script>
    let FPS = 30;            // match typical program framerate; adjustable
    let PREVIEW_W = 1280;    // preview size sent to iPad/watchers
    let PREVIEW_H = 720;     // lower this to buy CPU headroom at high fps
    const JPEG_QUALITY = 0.6; // smaller frames = less time on the wire

    let ws = null;
    let reconnectTimer = null;
    let stream = null;
    let frameTimer = null;

    const video = document.createElement('video');
    video.autoplay = true;
    video.muted = true;
    video.playsInline = true;

    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');

    function connectWS() {
      if (ws && (ws.readyState === 0 || ws.readyState === 1)) return;
      ws = new WebSocket(`ws://${location.host}?role=capture`);
      ws.onopen = reportDevices;
      ws.onmessage = (e) => {
        const msg = JSON.parse(e.data);
        if (msg.type === 'capture-start') startCapture(msg.deviceId);
        if (msg.type === 'capture-stop') stopCapture();
        if (msg.type === 'capture-rescan') reportDevices();
        if (msg.type === 'capture-fps' && msg.fps > 0) {
          FPS = msg.fps;
          if (frameTimer) startFrameLoop(); // re-time with the new rate
        }
        if (msg.type === 'capture-size' && msg.width > 0) {
          PREVIEW_W = msg.width;
          PREVIEW_H = msg.height;
          canvas.width = PREVIEW_W;
          canvas.height = PREVIEW_H;
        }
      };
      ws.onclose = () => {
        clearTimeout(reconnectTimer);
        reconnectTimer = setTimeout(connectWS, 2000);
      };
      ws.onerror = () => ws.close();
    }

    function send(obj) {
      if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj));
    }

    // Turn a getUserMedia DOMException into something actionable
    function explainError(e) {
      const detail = `${e.name}: ${e.message}`;
      switch (e.name) {
        case 'NotReadableError':
        case 'TrackStartError':
          return `Device is in use by another app — quit OBS (or any app using it) and rescan. [${detail}]`;
        case 'NotAllowedError':
        case 'SecurityError':
          return `Camera access blocked by macOS — System Settings > Privacy & Security > Camera. [${detail}]`;
        case 'NotFoundError':
        case 'DevicesNotFoundError':
          return `That device is no longer connected. [${detail}]`;
        case 'OverconstrainedError':
          return `Device does not support the requested format, or it disappeared. [${detail}]`;
        default:
          return detail;
      }
    }

    async function permissionState() {
      try {
        const s = await navigator.permissions.query({ name: 'camera' });
        return s.state;
      } catch (e) {
        return 'unqueryable';
      }
    }

    async function reportDevices() {
      let primeError = null;
      // Prime permission once so device labels are available
      try {
        const tmp = await navigator.mediaDevices.getUserMedia({ video: true });
        tmp.getTracks().forEach(t => t.stop());
      } catch (e) {
        primeError = `${e.name}: ${e.message}`;
      }
      const permission = await permissionState();
      try {
        const devs = (await navigator.mediaDevices.enumerateDevices())
          .filter(d => d.kind === 'videoinput')
          .map((d, i) => ({ index: d.deviceId, name: d.label || `Camera ${i + 1}` }));
        send({
          type: 'capture-devices',
          devices: devs,
          permission,
          error: devs.length === 0 ? (primeError || 'No video input devices found') : null
        });
      } catch (e) {
        send({
          type: 'capture-devices',
          devices: [],
          permission,
          error: `enumerateDevices failed — ${e.name}: ${e.message}`
        });
      }
    }

    navigator.mediaDevices.ondevicechange = reportDevices;

    async function startCapture(deviceId) {
      stopCapture(true);
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: {
            deviceId: deviceId ? { exact: deviceId } : undefined,
            width: { ideal: 1920 },
            height: { ideal: 1080 },
            frameRate: { ideal: FPS }
          }
        });
        video.srcObject = stream;
        await video.play();

        // Stream at preview resolution: plenty for the iPad, light on Wi-Fi
        canvas.width = PREVIEW_W;
        canvas.height = PREVIEW_H;

        startFrameLoop();

        // Report what the camera actually gave us — the source frame rate is
        // the ceiling for everything downstream
        const track = stream.getVideoTracks()[0];
        const st = track ? track.getSettings() : {};
        send({
          type: 'capture-state',
          current: deviceId,
          source: {
            width: st.width, height: st.height,
            frameRate: st.frameRate ? Math.round(st.frameRate) : null
          }
        });
      } catch (e) {
        send({
          type: 'capture-error',
          message: explainError(e),
          permission: await permissionState()
        });
        send({ type: 'capture-state', current: null });
      }
    }

    // Never queue a second encode/send: if we can't keep up, skip the frame
    // rather than build a backlog the viewer would see as lag.
    let inFlight = false;
    function startFrameLoop() {
      clearInterval(frameTimer);
      inFlight = false;
      frameTimer = setInterval(() => {
        if (video.readyState < 2 || inFlight) return;
        if (!ws || ws.readyState !== 1) return;
        // Socket already backed up — drop this frame
        if (ws.bufferedAmount > 512 * 1024) return;
        inFlight = true;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        canvas.toBlob(async (blob) => {
          try {
            if (blob && ws && ws.readyState === 1) {
              ws.send(await blob.arrayBuffer());
            }
          } finally {
            inFlight = false;
          }
        }, 'image/jpeg', JPEG_QUALITY);
      }, 1000 / FPS);
    }

    function stopCapture(silent) {
      clearInterval(frameTimer);
      frameTimer = null;
      if (stream) {
        stream.getTracks().forEach(t => t.stop());
        stream = null;
      }
      if (!silent) send({ type: 'capture-state', current: null });
    }

    connectWS();
  </script>
</body>
</html>
