<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Telestrator</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      padding: 32px 20px;
      background: #14161c;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    h1 {
      margin: 0;
      font-size: 30px;
      letter-spacing: 0.5px;
      font-weight: 700;
    }
    .sub { margin: -18px 0 0; color: #8a91a0; font-size: 15px; text-align: center; }

    .choices {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
      width: 100%;
      max-width: 720px;
    }
    a.choice {
      flex: 1 1 280px;
      min-height: 190px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 28px 22px;
      border-radius: 16px;
      text-decoration: none;
      color: #fff;
      border: 2px solid transparent;
      transition: transform 0.12s ease, border-color 0.12s ease;
    }
    a.choice:active { transform: scale(0.98); }
    a.draw {
      background: linear-gradient(145deg, #2f6b45, #245537);
      border-color: #3d8a59;
    }
    a.watch {
      background: linear-gradient(145deg, #2b4a6b, #223c57);
      border-color: #3a648f;
    }
    .icon { font-size: 42px; line-height: 1; }
    .label { font-size: 21px; font-weight: 700; }
    .desc { font-size: 14px; color: rgba(255,255,255,0.72); text-align: center; line-height: 1.5; }

    .footer { margin-top: 6px; }
    .footer a { color: #6a7488; font-size: 13px; text-decoration: none; }
    .footer a:hover { color: #9aa4b8; }
  </style>
</head>
<body>
  <h1>Telestrator</h1>
  <p class="sub">Choose how you want to join</p>

  <div class="choices">
    <a class="choice draw" href="/draw.html">
      <div class="icon">&#9998;</div>
      <div class="label">Telestrate</div>
      <div class="desc">Draw on the live feed.<br>For the commentator.</div>
    </a>
    <a class="choice watch" id="watch-link" href="/watch.html">
      <div class="icon">&#128065;</div>
      <div class="label">Watch Only</div>
      <div class="desc">See the feed and the drawings.<br>You cannot draw.</div>
    </a>
  </div>

  <div class="footer"><a href="/settings.html">Settings &amp; diagnostics</a></div>

  <script>
    // Send watchers to the dedicated watch-only port when it is reachable
    fetch('/api/status')
      .then(r => r.json())
      .then(s => {
        if (s.watchPort) {
          document.getElementById('watch-link').href =
            `${location.protocol}//${location.hostname}:${s.watchPort}`;
        }
      })
      .catch(() => { /* keep the same-port fallback */ });
  </script>
</body>
</html>
